name: "Relato de problema"
description: "Registro um comportamento inesperado para investigação."
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Uso este formulário para descrever problemas reproduzíveis. Não incluo segredos ou dados pessoais."
  - type: textarea
    id: observed
    attributes:
      label: "O que observei?"
      description: "Descrevo o comportamento encontrado."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "O que eu esperava?"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "Como reproduzo o problema?"
      description: "Incluo passos mínimos e dados fictícios."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Ambiente"
      placeholder: "Sistema operacional, versão de runtime ou navegador"
  - type: textarea
    id: logs
    attributes:
      label: "Logs ou evidências sem dados sensíveis"
