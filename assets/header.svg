<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Renan Monteiro Barros — Engenharia de Software &amp; Desenvolvimento Full Stack</title>
  <desc id="desc">Banner de perfil profissional de Renan Monteiro Barros: C#, .NET, ASP.NET Core, React, TypeScript, Python, Django e SQL.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06131a"/>
      <stop offset="50%" stop-color="#0b2938"/>
      <stop offset="100%" stop-color="#09382f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accentVertical" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glowRight" cx="85%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom" cx="20%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glowRight)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glowBottom)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>

  <!-- Decorative geometric elements -->
  <g opacity="0.22">
    <circle cx="1050" cy="160" r="190" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="6 8"/>
    <circle cx="1050" cy="160" r="135" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="1050" cy="160" r="80" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
  </g>

  <!-- Code / Architecture decorative card on right -->
  <g transform="translate(855, 68)">
    <rect width="275" height="184" rx="14" fill="#071821" fill-opacity="0.78" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <circle cx="22" cy="22" r="5" fill="#f87171" opacity="0.85"/>
    <circle cx="38" cy="22" r="5" fill="#fbbf24" opacity="0.85"/>
    <circle cx="54" cy="22" r="5" fill="#34d399" opacity="0.85"/>
    <line x1="0" y1="40" x2="275" y2="40" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    <text x="20" y="68" fill="#38bdf8" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="600">namespace</text>
    <text x="96" y="68" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" font-size="13">RMBarros.Dev;</text>
    <text x="20" y="96" fill="#34d399" font-family="Consolas, 'Courier New', monospace" font-size="13">stack</text>
    <text x="64" y="96" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="13">= [</text>
    <text x="34" y="118" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="13">".NET / C#", "React",</text>
    <text x="34" y="140" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="13">"TypeScript", "Django"</text>
    <text x="20" y="162" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="13">];</text>
  </g>

  <!-- Left accent bar -->
  <rect x="68" y="56" width="6" height="208" rx="3" fill="url(#accentVertical)"/>

  <!-- Main typography -->
  <text x="98" y="92" fill="#34d399" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">PORTFÓLIO DE ENGENHARIA DE SOFTWARE</text>
  <text x="96" y="148" fill="#f8fafc" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="48" font-weight="700">Renan Monteiro Barros</text>
  <text x="98" y="188" fill="#cbd5e1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="20" font-weight="400">Desenvolvedor Full Stack em formação  •  Ciência da Computação</text>

  <!-- Tech Pill Badges inside SVG -->
  <g transform="translate(98, 216)" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="96" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.4" stroke-width="1"/>
    <text x="48" y="21" fill="#ecfdf5" text-anchor="middle">C# &amp; .NET</text>

    <rect x="108" y="0" width="132" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="174" y="21" fill="#f0f9ff" text-anchor="middle">ASP.NET Core</text>

    <rect x="252" y="0" width="154" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="329" y="21" fill="#f0f9ff" text-anchor="middle">React &amp; TypeScript</text>

    <rect x="418" y="0" width="136" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.4" stroke-width="1"/>
    <text x="486" y="21" fill="#ecfdf5" text-anchor="middle">Python &amp; Django</text>

    <rect x="566" y="0" width="138" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="635" y="21" fill="#eef2ff" text-anchor="middle">SQL &amp; PostgreSQL</text>
  </g>
</svg>
