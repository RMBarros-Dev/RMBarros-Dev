<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Renan Monteiro Barros — Desenvolvimento de Software</title>
  <desc id="desc">Identidade visual profissional com foco em Ciência da Computação, engenharia de software, backend, APIs e desenvolvimento web.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081522"/>
      <stop offset="0.58" stop-color="#102b3b"/>
      <stop offset="1" stop-color="#123d3a"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.52" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <radialGradient id="ambient" cx="82%" cy="30%" r="62%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#dbeafe" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#background)"/>
  <rect width="1200" height="340" rx="24" fill="url(#ambient)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>

  <g opacity=".22" fill="none" stroke="url(#highlight)">
    <circle cx="1034" cy="170" r="174" stroke-width="1.5" stroke-dasharray="3 9"/>
    <circle cx="1034" cy="170" r="132" stroke-width="1"/>
    <circle cx="1034" cy="170" r="88" stroke-width="1.5"/>
  </g>

  <rect x="68" y="58" width="5" height="224" rx="2.5" fill="url(#highlight)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="100" y="91" fill="#5eead4" font-size="14" font-weight="700" letter-spacing="3.2">PORTFÓLIO • SOFTWARE DEVELOPMENT</text>
    <text x="96" y="153" fill="#f8fafc" font-size="47" font-weight="750" letter-spacing="-1.1">Renan Monteiro Barros</text>
    <text x="100" y="193" fill="#cbd5e1" font-size="20" font-weight="400">Ciência da Computação  ·  Desenvolvimento de Software</text>
    <text x="100" y="226" fill="#94a3b8" font-size="15">Backend, APIs, aplicações web e arquitetura de software</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="650">
    <rect x="100" y="250" width="104" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#5eead4" stroke-opacity=".45"/>
    <text x="152" y="272" fill="#ccfbf1" text-anchor="middle">C# / .NET</text>
    <rect x="216" y="250" width="151" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#60a5fa" stroke-opacity=".45"/>
    <text x="291.5" y="272" fill="#dbeafe" text-anchor="middle">React / TypeScript</text>
    <rect x="379" y="250" width="136" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#5eead4" stroke-opacity=".45"/>
    <text x="447" y="272" fill="#ccfbf1" text-anchor="middle">Python / Django</text>
    <rect x="527" y="250" width="132" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#a5b4fc" stroke-opacity=".45"/>
    <text x="593" y="272" fill="#e0e7ff" text-anchor="middle">SQL / PostgreSQL</text>
  </g>

  <g transform="translate(870 82)" font-family="Consolas, 'Courier New', monospace">
    <rect width="248" height="174" rx="15" fill="#07131e" fill-opacity=".76" stroke="#cbd5e1" stroke-opacity=".16"/>
    <circle cx="20" cy="20" r="4.5" fill="#fb7185"/>
    <circle cx="36" cy="20" r="4.5" fill="#fbbf24"/>
    <circle cx="52" cy="20" r="4.5" fill="#34d399"/>
    <path d="M0 39H248" stroke="#cbd5e1" stroke-opacity=".12"/>
    <text x="20" y="68" fill="#93c5fd" font-size="13">const developer = {</text>
    <text x="34" y="93" fill="#e2e8f0" font-size="12">focus: "software",</text>
    <text x="34" y="116" fill="#e2e8f0" font-size="12">build: ["APIs", "Web"],</text>
    <text x="34" y="139" fill="#e2e8f0" font-size="12">learn: "every day"</text>
    <text x="20" y="160" fill="#93c5fd" font-size="13">};</text>
  </g>
</svg>